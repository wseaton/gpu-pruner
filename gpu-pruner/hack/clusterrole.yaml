kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: gpu-pruner-cr
rules:
  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - ''
    resources:
      - pods
  - verbs:
      - create
    apiGroups:
      - ''
    resources:
      - events
  - verbs:
      - get
      - list
      - watch
      - patch
    apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
  - verbs:
      # scale-down patches the /scale subresource, which RBAC treats as a
      # distinct resource from the parent. Without these the pruner 403s in
      # scale-down mode (it works in dry-run because it never patches).
      - get
      - patch
    apiGroups:
      - apps
    resources:
      - deployments/scale
      - replicasets/scale
      - statefulsets/scale
  - verbs:
      - get
      - list
      - watch
      - patch
    apiGroups:
      - kubeflow.org
    resources:
      - notebooks
  - verbs:
      - get
      - list
      - watch
      - patch
    apiGroups:
      - serving.kserve.io
    resources:
      - inferenceservices
  - verbs:
      - get
      - list
      - watch
      - patch
    apiGroups:
      - leaderworkerset.x-k8s.io
    resources:
      - leaderworkersets
  - verbs:
      - get
      - patch
    apiGroups:
      - leaderworkerset.x-k8s.io
    resources:
      - leaderworkersets/scale
